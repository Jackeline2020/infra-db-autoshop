name: CI - infra-db

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Cada banco é uma stack independente, validada no próprio job
  terraform-validate:
    name: Validar ${{ matrix.stack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [os, billing, execution]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=${{ matrix.stack }} fmt -check -recursive
      - run: terraform -chdir=${{ matrix.stack }} init -backend=false
      - run: terraform -chdir=${{ matrix.stack }} validate
